name: Test Nx 9Router Instances

on:
  workflow_dispatch:
    inputs:
      num_instances:
        description: 'Number of 9Router instances (default 5)'
        required: false
        type: string
        default: '5'

jobs:
  test-routers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install 9Router
        run: |
          npm install -g 9router@0.5.40 2>&1 | tail -5

      - name: Prepare instances
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-5}
          BASE_PORT=21001
          echo "🎯 Preparing $NUM 9Router instances..."
          
          # Find 9router paths (global npm)
          GLOBAL_NM=$(npm root -g)
          ROUTER_DIR="$GLOBAL_NM/9router"
          APP_DIR="$ROUTER_DIR/app"
          SERVER="$APP_DIR/server.js"
          BUNDLED_NM="$APP_DIR/node_modules"
          echo "9router dir: $ROUTER_DIR"
          echo "server: $SERVER"
          ls -la "$SERVER"
          
          # Save paths for later steps
          echo "$ROUTER_DIR" > /tmp/router_dir.txt
          echo "$BUNDLED_NM" > /tmp/bundled_nm.txt
          
          cat > /tmp/seed_db.py << 'PYEOF'
          import sqlite3, json, uuid, sys, os
          instance_num = int(sys.argv[1])
          datadir = sys.argv[2]
          apikey = sys.argv[3]
          db_path = os.path.join(datadir, '.9router', 'db', 'data.sqlite')
          os.makedirs(os.path.dirname(db_path), exist_ok=True)
          conn = sqlite3.connect(db_path)
          c = conn.cursor()
          c.executescript('''
          CREATE TABLE IF NOT EXISTS _meta (key TEXT PRIMARY KEY, value TEXT);
          CREATE TABLE IF NOT EXISTS settings (id INTEGER PRIMARY KEY, data TEXT);
          CREATE TABLE IF NOT EXISTS providerConnections (id TEXT PRIMARY KEY, provider TEXT, authType TEXT, name TEXT, email TEXT, priority INTEGER, isActive INTEGER, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS providerNodes (id TEXT PRIMARY KEY, type TEXT, name TEXT, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS proxyPools (id TEXT PRIMARY KEY, isActive INTEGER, testStatus TEXT, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS apiKeys (id TEXT PRIMARY KEY, key TEXT, name TEXT, machineId TEXT, isActive INTEGER, createdAt TEXT);
          CREATE TABLE IF NOT EXISTS combos (id TEXT PRIMARY KEY, name TEXT, kind TEXT, models TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS kv (scope TEXT, key TEXT, value TEXT, PRIMARY KEY (scope, key));
          CREATE TABLE IF NOT EXISTS usageHistory (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, provider TEXT, model TEXT, connectionId TEXT, apiKey TEXT, endpoint TEXT, promptTokens INTEGER, completionTokens INTEGER, cost REAL, status TEXT, tokens TEXT, meta TEXT);
          CREATE TABLE IF NOT EXISTS usageDaily (dateKey TEXT PRIMARY KEY, data TEXT);
          CREATE TABLE IF NOT EXISTS requestDetails (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, provider TEXT, model TEXT, connectionId TEXT, status TEXT, data TEXT);
          ''')
          combo_id = str(uuid.uuid4())
          c.execute('INSERT INTO combos (id, name, kind, models, createdAt, updatedAt) VALUES (?, ?, ?, ?, ?, ?)',
                    (combo_id, '9Router', None, json.dumps(['oc/deepseek-v4-flash-free']), '2026-08-08T00:00:00.000Z', '2026-08-08T00:00:00.000Z'))
          key_id = str(uuid.uuid4())
          c.execute('INSERT INTO apiKeys (id, key, name, machineId, isActive, createdAt) VALUES (?, ?, ?, ?, ?, ?)',
                    (key_id, apikey, 'test-' + str(instance_num), None, 1, '2026-08-08T00:00:00.000Z'))
          for model_id in ['deepseek-v4-flash-free', 'mimo-v2.5-free', 'longcat-2.0-free']:
              kv_key = 'oc|' + model_id + '|llm'
              kv_val = json.dumps({'providerAlias': 'oc', 'id': model_id, 'type': 'llm', 'name': model_id})
              c.execute('INSERT OR REPLACE INTO kv (scope, key, value) VALUES (?, ?, ?)', ('customModels', kv_key, kv_val))
          c.execute('INSERT OR REPLACE INTO _meta (key, value) VALUES (?, ?)', ('schemaVersion', '1'))
          c.execute('INSERT OR REPLACE INTO _meta (key, value) VALUES (?, ?)', ('backupSchemaVersion', '1'))
          conn.commit()
          conn.close()
          PYEOF
          
          > /tmp/router_keys.txt
          for i in $(seq 1 $NUM); do
            PORT=$((BASE_PORT + i - 1))
            DATADIR="/tmp/router-$i"
            APIKEY="sk-test-$(openssl rand -hex 16)"
            mkdir -p "$DATADIR/.9router/db"
            python3 /tmp/seed_db.py "$i" "$DATADIR" "$APIKEY"
            echo "$i|$PORT|$APIKEY" >> /tmp/router_keys.txt
          done
          echo "📋 All $NUM instances prepared"
          cat /tmp/router_keys.txt

      - name: Start instances (bypass killAll)
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-5}
          BASE_PORT=21001
          ROUTER_DIR=$(cat /tmp/router_dir.txt)
          BUNDLED_NM=$(cat /tmp/bundled_nm.txt)
          SERVER="$ROUTER_DIR/app/server.js"
          
          echo "🚀 Starting $NUM instances (direct server.js, no CLI killAll)..."
          
          for i in $(seq 1 $NUM); do
            PORT=$((BASE_PORT + i - 1))
            DATADIR="/tmp/router-$i"
            RUNTIME_NM="$DATADIR/.9router/runtime/node_modules"
            
            # Build NODE_PATH: runtime + bundled + system
            NODE_PATH="$RUNTIME_NM:$BUNDLED_NM:$NODE_PATH"
            
            # Run server.js directly — no cli.js, no killAllAppProcesses
            HOME="$DATADIR" \
            NODE_PATH="$NODE_PATH" \
            PORT=$PORT \
            HOSTNAME=127.0.0.1 \
            node --dns-result-order=ipv4first --max-old-space-size=512 "$SERVER" \
              > "/tmp/router-$i.log" 2>&1 &
            echo "Started instance $i on port $PORT (pid $!)"
          done
          
          # Wait for all to be ready
          echo "Waiting 20s for instances to start..."
          sleep 20
          
          # Check which are ready
          READY=0
          for i in $(seq 1 $NUM); do
            PORT=$((BASE_PORT + i - 1))
            if curl -s -m 5 http://127.0.0.1:$PORT/v1/models > /dev/null 2>&1; then
              READY=$((READY + 1))
              echo "  ✅ Instance $i ready on port $PORT"
            else
              echo "  ❌ Instance $i NOT ready on port $PORT"
              echo "  --- Log tail ---"
              tail -5 "/tmp/router-$i.log" 2>/dev/null
            fi
          done
          echo "Ready: $READY / $NUM"
          echo "=== RAM ==="
          free -m | head -3
          echo "=== 9router processes ==="
          ps aux | grep '[s]erver.js' | wc -l

      - name: Test all instances
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-5}
          BASE_PORT=21001
          TEST_QUESTION="What is 2+2? Reply with only the number."
          
          echo "🧪 Testing $NUM instances..."
          echo "============================================"
          
          cat > /tmp/parse.py << 'PYEOF'
          import sys, json
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              if 'error' in d:
                  print('ERROR: ' + d['error'].get('message', str(d['error'])[:200]))
              else:
                  msg = d['choices'][0]['message']
                  content = msg.get('content') or ''
                  if not content and msg.get('reasoning_content'):
                      content = msg['reasoning_content']
                  print(content.strip() if content else 'EMPTY')
          except Exception as e:
              # Try to extract content even from truncated JSON
              import re
              m = re.search(r'"content"\s*:\s*"([^"]+)"', raw)
              if m:
                  print(m.group(1))
              else:
                  print('PARSE_ERROR: ' + raw[:300])
          PYEOF
          
          PASS=0
          FAIL=0
          
          for i in $(seq 1 $NUM); do
            PORT=$((BASE_PORT + i - 1))
            KEY=$(grep "^${i}|" /tmp/router_keys.txt | cut -d'|' -f3)
            
            echo "--- Instance $i (port $PORT) ---"
            echo "  KEY: ${KEY:0:20}..."
            
            RESPONSE=$(curl -s -m 30 http://127.0.0.1:$PORT/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -d "{\"model\":\"oc/deepseek-v4-flash-free\",\"messages\":[{\"role\":\"user\",\"content\":\"$TEST_QUESTION\"}],\"max_tokens\":50}" 2>&1)
            
            CONTENT=$(echo "$RESPONSE" | python3 /tmp/parse.py 2>&1)
            
            if echo "$CONTENT" | grep -qi "error"; then
              echo "  ❌ FAIL: $CONTENT"
              FAIL=$((FAIL + 1))
            else
              echo "  ✅ Response: $CONTENT"
              PASS=$((PASS + 1))
            fi
          done
          
          echo ""
          echo "============================================"
          echo "📊 RESULTS: $PASS passed, $FAIL failed (out of $NUM)"
          echo "============================================"
          
          echo "$PASS/$NUM" > /tmp/test_summary.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9router-test-results
          path: |
            /tmp/test_summary.txt
            /tmp/router_keys.txt

name: Test 20x 9Router Instances

on:
  workflow_dispatch:
    inputs:
      num_instances:
        description: 'Number of 9Router instances (default 20)'
        required: false
        type: string
        default: '20'

jobs:
  test-routers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install 9Router
        run: |
          npm install -g 9router@0.5.40 2>&1 | tail -5
          echo "9Router installed: $(9router --version 2>/dev/null || echo 'unknown')"

      - name: Prepare 20 instances
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-20}
          echo "🎯 Starting $NUM 9Router instances..."
          
          BASE_PORT=21000
          TEST_QUESTION="What is 2+2? Reply with only the number."
          EXPECTED="4"
          
          # Create data dirs and pre-seed each with a unique API key
          for i in $(seq 1 $NUM); do
            PORT=$((BASE_PORT + i - 1))
            DATADIR="/tmp/router-$i"
            mkdir -p "$DATADIR/.9router/db"
            
            # Generate a unique API key for this instance
            APIKEY="sk-test-$(openssl rand -hex 12)"
            
            # Create minimal SQLite DB with combo + apiKey + customModels
            python3 -c "
          import sqlite3, json, uuid, os
          db_path = '$DATADIR/.9router/db/data.sqlite'
          conn = sqlite3.connect(db_path)
          c = conn.cursor()
          
          # Schema (matching 9Router v0.5.40)
          c.executescript('''
          CREATE TABLE IF NOT EXISTS _meta (key TEXT PRIMARY KEY, value TEXT);
          CREATE TABLE IF NOT EXISTS settings (id INTEGER PRIMARY KEY, data TEXT);
          CREATE TABLE IF NOT EXISTS providerConnections (id TEXT PRIMARY KEY, provider TEXT, authType TEXT, name TEXT, email TEXT, priority INTEGER, isActive INTEGER, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS providerNodes (id TEXT PRIMARY KEY, type TEXT, name TEXT, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS proxyPools (id TEXT PRIMARY KEY, isActive INTEGER, testStatus TEXT, data TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS apiKeys (id TEXT PRIMARY KEY, key TEXT, name TEXT, machineId TEXT, isActive INTEGER, createdAt TEXT);
          CREATE TABLE IF NOT EXISTS combos (id TEXT PRIMARY KEY, name TEXT, kind TEXT, models TEXT, createdAt TEXT, updatedAt TEXT);
          CREATE TABLE IF NOT EXISTS kv (scope TEXT, key TEXT, value TEXT, PRIMARY KEY (scope, key));
          CREATE TABLE IF NOT EXISTS usageHistory (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, provider TEXT, model TEXT, connectionId TEXT, apiKey TEXT, endpoint TEXT, promptTokens INTEGER, completionTokens INTEGER, cost REAL, status TEXT, tokens TEXT, meta TEXT);
          CREATE TABLE IF NOT EXISTS usageDaily (dateKey TEXT PRIMARY KEY, data TEXT);
          CREATE TABLE IF NOT EXISTS requestDetails (id INTEGER PRIMARY KEY AUTOINCREMENT, timestamp TEXT, provider TEXT, model TEXT, connectionId TEXT, status TEXT, data TEXT);
          ''')
          
          # Insert combo with deepseek
          combo_id = str(uuid.uuid4())
          c.execute('INSERT INTO combos (id, name, kind, models, createdAt, updatedAt) VALUES (?, ?, ?, ?, ?, ?)',
                    (combo_id, '9Router', None, json.dumps(['oc/deepseek-v4-flash-free', 'mmf/mimo-auto']), '2026-08-08T00:00:00.000Z', '2026-08-08T00:00:00.000Z'))
          
          # Insert API key
          key_id = str(uuid.uuid4())
          c.execute('INSERT INTO apiKeys (id, key, name, machineId, isActive, createdAt) VALUES (?, ?, ?, ?, ?, ?)',
                    (key_id, '$APIKEY', 'test-instance-' + str($i), None, 1, '2026-08-08T00:00:00.000Z'))
          
          # Insert custom models
          for model_id in ['deepseek-v4-flash-free', 'mimo-v2.5-free', 'longcat-2.0-free']:
            kv_key = 'oc|' + model_id + '|llm'
            kv_val = json.dumps({'providerAlias': 'oc', 'id': model_id, 'type': 'llm', 'name': model_id})
            c.execute('INSERT OR REPLACE INTO kv (scope, key, value) VALUES (?, ?, ?)', ('customModels', kv_key, kv_val))
          
          # Meta
          c.execute('INSERT OR REPLACE INTO _meta (key, value) VALUES (?, ?)', ('schemaVersion', '1'))
          c.execute('INSERT OR REPLACE INTO _meta (key, value) VALUES (?, ?)', ('backupSchemaVersion', '1'))
          
          conn.commit()
          conn.close()
          print(f'✅ Instance $i DB created at {db_path} with key {APIKEY[:15]}...')
          "
            
            # Save key for later
            echo "$PORT|$APIKEY" >> /tmp/router_keys.txt
          done
          
          echo "📋 All $NUM instances prepared"
          cat /tmp/router_keys.txt

      - name: Start 20 instances
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-20}
          echo "🚀 Starting $NUM 9Router instances on ports 21001-210$NUM..."
          
          for i in $(seq 1 $NUM); do
            PORT=$((21000 + i - 1))
            DATADIR="/tmp/router-$i"
            
            # Start 9Router with HOME pointing to our data dir
            HOME="$DATADIR" 9router --port $PORT --no-browser --skip-update > "/tmp/router-$i.log" 2>&1 &
            PID=$!
            echo "Instance $i: port=$PORT pid=$PID"
            
            # Wait for this instance to be ready (max 15s)
            for j in $(seq 1 30); do
              if curl -s -m 1 http://127.0.0.1:$PORT/v1/models > /dev/null 2>&1; then
                echo "  ✅ Instance $i ready on port $PORT (${j}s)"
                break
              fi
              sleep 0.5
            done
          done
          
          echo ""
          echo "=== All instances started ==="
          # Show how many are responding
          READY=0
          for i in $(seq 1 $NUM); do
            PORT=$((21000 + i - 1))
            if curl -s -m 2 http://127.0.0.1:$PORT/v1/models > /dev/null 2>&1; then
              READY=$((READY + 1))
            fi
          done
          echo "Ready: $READY / $NUM"

      - name: Test all instances
        env:
          NUM: ${{ github.event.inputs.num_instances }}
        run: |
          NUM=${NUM:-20}
          TEST_QUESTION="What is 2+2? Reply with only the number."
          
          echo "🧪 Testing $NUM instances with question: '$TEST_QUESTION'"
          echo "============================================"
          
          PASS=0
          FAIL=0
          RESULTS=""
          
          for i in $(seq 1 $NUM); do
            PORT=$((21000 + i - 1))
            KEY=$(grep "^$PORT|" /tmp/router_keys.txt | cut -d'|' -f2)
            
            echo "--- Instance $i (port $PORT) ---"
            
            RESPONSE=$(curl -s -m 30 http://127.0.0.1:$PORT/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -d "{\"model\":\"oc/deepseek-v4-flash-free\",\"messages\":[{\"role\":\"user\",\"content\":\"$TEST_QUESTION\"}],\"max_tokens\":50}" 2>&1)
            
            # Extract content from response
            CONTENT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              c = d['choices'][0]['message']['content']
              print(c.strip())
          except:
              print('ERROR: ' + sys.stdin.read()[:200])
          " 2>&1)
            
            # Check for errors
            if echo "$RESPONSE" | grep -q '"error"'; then
              ERROR_MSG=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',{}).get('message','unknown'))" 2>/dev/null)
              echo "  ❌ FAIL: $ERROR_MSG"
              FAIL=$((FAIL + 1))
              RESULTS="$RESULTS\nInstance $i (port $PORT): ❌ FAIL - $ERROR_MSG"
            elif echo "$CONTENT" | grep -qi "error"; then
              echo "  ❌ FAIL: $CONTENT"
              FAIL=$((FAIL + 1))
              RESULTS="$RESULTS\nInstance $i (port $PORT): ❌ FAIL - $CONTENT"
            else
              echo "  ✅ Response: $CONTENT"
              PASS=$((PASS + 1))
              RESULTS="$RESULTS\nInstance $i (port $PORT): ✅ OK - $CONTENT"
            fi
          done
          
          echo ""
          echo "============================================"
          echo "📊 RESULTS: $PASS passed, $FAIL failed (out of $NUM)"
          echo "============================================"
          echo -e "$RESULTS"
          
          # Save results for artifact
          echo -e "$RESULTS" > /tmp/test_results.txt
          echo "$PASS/$NUM" > /tmp/test_summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: 9router-test-results
          path: |
            /tmp/test_results.txt
            /tmp/test_summary.txt
            /tmp/router_keys.txt

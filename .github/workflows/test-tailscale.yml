name: Test Tailscale Join

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install + join tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -x
          # Install tailscale (NOT preinstalled on GH runners)
          curl -fsSL https://tailscale.com/install.sh | sh 2>&1 | tail -3
          echo "--- start systemd ---"
          sudo systemctl start tailscaled 2>&1 | head -2 || true
          sleep 3
          echo "--- tailscale status ---"
          tailscale status 2>&1 | head -5
          echo "--- up ---"
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="test-join-${{ github.run_id }}" 2>&1 | head -10
          echo "--- ip ---"
          tailscale ip -4 2>&1 | head -3
          echo "--- serve test ---"
          
          sudo tailscale serve --bg 21001 2>&1 | head -8

      - name: Verify tailnet peers
        run: |
          echo "--- peers ---"
          sleep 5
          sudo tailscale status --json > /tmp/ts_peers.json 2>&1 || true
          printf %s  | base64 -d > /tmp/peers.py
          python3 /tmp/peers.py || true

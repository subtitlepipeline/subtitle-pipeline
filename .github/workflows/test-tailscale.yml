name: Test Tailscale Join

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install + join tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -x
          # Use the PREINSTALLED tailscaled (systemd service on GH runners)
          sudo systemctl start tailscaled 2>&1 | head -2 || true
          sleep 3
          echo "--- tailscale status ---"
          tailscale status 2>&1 | head -5
          echo "--- up ---"
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="test-join-${{ github.run_id }}" 2>&1 | head -10
          echo "--- ip ---"
          tailscale ip -4 2>&1 | head -3
          echo "--- serve test ---"
          sudo tailscale serve --bg 21001 2>&1 | head -8
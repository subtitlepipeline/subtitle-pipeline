name: Whisper Only

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true
        type: string

jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install faster-whisper

      - name: Download video from VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          mkdir -p output
          curl -sL "http://$VPS_IP:9999/video.mp4" -o output/video.mp4
          curl -sL "http://$VPS_IP:9999/title.txt" -o output/title.txt
          ls -lh output/video.mp4

      - name: Whisper large-v3 transcription
        run: python3 scripts/whisper_transcribe.py output/video.mp4 output/transcript.json

      - name: Upload transcript
        run: |
          VIDEO_TITLE=$(cat output/title.txt 2>/dev/null || echo "transcript")
          gh release create "whisper-$VIDEO_TITLE" output/transcript.json \
            --repo ${{ github.repository }} \
            --title "Whisper: $VIDEO_TITLE" \
            --generate-notes 2>/dev/null || \
          gh release upload "whisper-$VIDEO_TITLE" output/transcript.json \
            --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

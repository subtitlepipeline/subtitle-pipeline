name: Subtitle Pipeline (Final)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL (downloaded on VPS, served via HTTP)'
        required: true
        type: string
      model:
        description: 'Primary translation model (optional, overrides default)'
        required: false
        type: string

jobs:
  subtitle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-vazirmatn curl

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install faster-whisper pysubs2 openai requests

      - name: Download video from VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          mkdir -p output
          curl -sL "http://$VPS_IP:9999/video.mp4" -o output/video.mp4
          curl -sL "http://$VPS_IP:9999/title.txt" -o output/title.txt
          ls -lh output/video.mp4
          echo "Video title: $(cat output/title.txt)"
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 output/video.mp4

      - name: Whisper transcription (large-v3)
        run: |
          python3 scripts/final/02_whisper.py output/video.mp4 output/transcript.json

      - name: Translate to Persian (Primary+Fallback via external API)
        env:
          ROUTER_KEY: ${{ secrets.ROUTER_KEY }}
          MODEL_INPUT: ${{ inputs.model }}
        run: |
          export ROUTER_BASE="https://9router.codol.ir/v1"
          export ROUTER_KEY="${{ secrets.ROUTER_KEY }}"
          if [ -n "$MODEL_INPUT" ]; then
            export ROUTER_MODEL="$MODEL_INPUT"
            echo "📌 Using workflow input model: $MODEL_INPUT"
          fi
          python3 scripts/final/03_translate.py output/transcript.json output/translated.json

      - name: Build SRT + Validate (3x)
        run: |
          python3 scripts/final/04_build_srt.py output/transcript.json output/translated.json output/subtitle.srt
          python3 scripts/final/validate_subs.py output/subtitle.srt fa
          python3 scripts/final/validate_subs.py output/subtitle.srt fa
          python3 scripts/final/validate_subs.py output/subtitle.srt fa

      - name: Build cinema ASS
        run: |
          VIDEO_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/video.mp4)
          FONTSIZE=$(python3 -c "print(round($VIDEO_HEIGHT * 0.014))")
          python3 scripts/final/make_cinema_ass.py output/subtitle.srt output/subtitle.ass $FONTSIZE

      - name: Burn-in subtitles (1080p + 720p + 480p)
        run: |
          VIDEO_TITLE=$(cat output/title.txt)
          python3 scripts/final/05_burnin.py output/video.mp4 output/subtitle.ass "output/$VIDEO_TITLE"

      - name: Upload to GitHub Release
        run: |
          VIDEO_TITLE=$(cat output/title.txt)
          python3 scripts/final/06_upload.py "output/$VIDEO_TITLE" output/subtitle.srt output/subtitle.ass "$VIDEO_TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output result
        run: |
          cat output/result.json

  cleanup:
    needs: subtitle
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - name: Delete releases older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting releases older than: $CUTOFF"
          gh release list --repo subtitlepipeline/subtitle-pipeline --json tagName,createdAt -q '.[] | "\(.createdAt) \(.tagName)"' | while read -r line; do
            CREATED=$(echo "$line" | awk '{print $1}')
            TAG=$(echo "$line" | awk '{print $2}')
            if [[ "$CREATED" < "$CUTOFF" ]]; then
              echo "Deleting release $TAG (created $CREATED)"
              gh release delete "$TAG" --repo subtitlepipeline/subtitle-pipeline --yes --cleanup-tag
            fi
          done
          echo "Cleanup done"

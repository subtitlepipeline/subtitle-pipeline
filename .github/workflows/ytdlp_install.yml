name: YT-DLP Install & Test
run-name: "yt-dlp test ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}"

on:
  workflow_dispatch:
    inputs:
      use_proxy:
        description: 'Use VPS as proxy'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp + Node.js
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs npm 2>&1 | tail -1
          pip install yt-dlp --break-system-packages
          echo "✅ yt-dlp: $(yt-dlp --version)"

      - name: Test with VPS proxy (${{ secrets.VPS_IP }})
        if: ${{ github.event.inputs.use_proxy == 'true' }}
        run: |
          PROXY="http://${{ secrets.VPS_IP }}:3128"
          URL="https://www.youtube.com/watch?v=krNP8RlDsbw"
          
          echo "=== Proxy test ==="
          yt-dlp --no-playlist --print "title" \
            --proxy "$PROXY" \
            "$URL" 2>&1

      - name: Test direct download (expected to fail)
        run: |
          URL="https://www.youtube.com/watch?v=krNP8RlDsbw"
          echo "=== Direct test (expect bot block) ==="
          yt-dlp --no-playlist --print "title" "$URL" 2>&1 || echo "✅ Block confirmed - as expected"

      - name: Download via VPS HTTP (current method)
        run: |
          curl -sL "http://${{ secrets.VPS_IP }}:9999/video.mp4" \
            -o /tmp/test_video.mp4 2>&1
          ls -lh /tmp/test_video.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 /tmp/test_video.mp4

name: YT-DLP Install & Test
run-name: "yt-dlp test"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js (for JS runtime)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs npm 2>&1 | tail -3
          node --version
          npm --version

      - name: Install yt-dlp
        run: |
          pip install yt-dlp --break-system-packages
          yt-dlp --version

      - name: Test with different client strategies
        run: |
          URL="https://www.youtube.com/watch?v=krNP8RlDsbw"
          
          echo "=== 1) android client ==="
          yt-dlp --no-playlist --print "title" --print "duration_string" \
            --extractor-args "youtube:player_client=android" \
            "$URL" 2>&1
          
          echo ""
          echo "=== 2) ios client ==="
          yt-dlp --no-playlist --print "title" --print "duration_string" \
            --extractor-args "youtube:player_client=ios" \
            "$URL" 2>&1

      - name: Test format list with android
        run: |
          yt-dlp --list-formats \
            --extractor-args "youtube:player_client=android" \
            "https://www.youtube.com/watch?v=krNP8RlDsbw" 2>&1 | head -20

      - name: Test download with android
        run: |
          yt-dlp -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
            -o "/tmp/test_video.mp4" --merge-output-format mp4 \
            --no-playlist \
            --extractor-args "youtube:player_client=android" \
            "https://www.youtube.com/watch?v=krNP8RlDsbw" 2>&1
          ls -lh /tmp/test_video.mp4 2>/dev/null || echo "❌ Download failed"

name: YT-DLP Install & Test
run-name: "yt-dlp test"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deps
        run: |
          echo "✅ python3: $(python3 --version)"
          which ffmpeg && echo "✅ ffmpeg OK" || echo "⚠️ ffmpeg not pre-installed"
          which ffprobe && echo "✅ ffprobe OK" || echo "⚠️ ffprobe not pre-installed"

      - name: Install yt-dlp (pip)
        run: |
          pip install yt-dlp --break-system-packages
          yt-dlp --version

      - name: Test format listing
        run: |
          echo "=== Test listing ==="
          yt-dlp --no-playlist --print "title" --print "duration_string" \
            "https://www.youtube.com/watch?v=krNP8RlDsbw" 2>&1

      - name: Test download 720p
        run: |
          yt-dlp -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
            -o "/tmp/test_video.mp4" --merge-output-format mp4 \
            --no-playlist \
            "https://www.youtube.com/watch?v=krNP8RlDsbw" 2>&1
          ls -lh /tmp/test_video.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 /tmp/test_video.mp4

      - name: List formats
        run: |
          yt-dlp --list-formats "https://www.youtube.com/watch?v=krNP8RlDsbw" 2>&1 | head -30
